<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AmplifyME 赛前笔记：从零看懂金融市场</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F8; --surface:#FFFFFF; --sunk:#E8EDF3; --ink:#15253A; --muted:#5E6E82; --line:#D3DBE5;
  --buy:#A86A10; --buy-soft:#F6E9D2; --sell:#2152C4; --sell-soft:#DDE6FA; --flow:#1A7A57; --flow-soft:#D8F0E5;
  --plat:#5B6577; --plat-soft:#E4E7EC; --danger:#B33A2E;
  --sans:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Noto Serif SC","Songti SC","STSong",Georgia,serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1828; --surface:#16233A; --sunk:#1C2C47; --ink:#E5ECF5; --muted:#93A4BC; --line:#2A3D5C;
    --buy:#E5AB4E; --buy-soft:#3A2E18; --sell:#7EA6FF; --sell-soft:#1D2E52; --flow:#55CC9E; --flow-soft:#173A31;
    --plat:#A8B2C3; --plat-soft:#25324A; --danger:#FF7A6B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#16233A; --sunk:#1C2C47; --ink:#E5ECF5; --muted:#93A4BC; --line:#2A3D5C;
  --buy:#E5AB4E; --buy-soft:#3A2E18; --sell:#7EA6FF; --sell-soft:#1D2E52; --flow:#55CC9E; --flow-soft:#173A31;
  --plat:#A8B2C3; --plat-soft:#25324A; --danger:#FF7A6B; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 60px}
header.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(26px,3.4vw,38px);line-height:1.25;margin:0;letter-spacing:.01em}
h1 .split{display:block;font-size:.52em;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-top:6px}
.progress{min-width:240px}
.progress .bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:6px}
.progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--buy),var(--sell));width:0;transition:width .4s}
.progress small{color:var(--muted)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:22px}
nav.tabs button{font:inherit;font-size:15px;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
nav.tabs button:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--sell);outline-offset:2px}
section.panel{display:none}
section.panel.on{display:block}

/* mind map */
.map{display:grid;grid-template-columns:minmax(300px,42%) 1fr;gap:24px;align-items:start}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:0 0 12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
.tree{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 12px 16px 8px}
.tree ul{list-style:none;margin:0;padding-left:20px;position:relative}
.tree>ul{padding-left:4px}
.tree li{position:relative;margin:2px 0}
.tree ul ul{border-left:1.5px solid var(--line);margin-left:9px;padding-left:16px}
.tree ul ul>li::before{content:"";position:absolute;left:-16px;top:17px;width:13px;border-top:1.5px solid var(--line)}
.node{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;font-size:14.5px;background:none;border:1px solid transparent;border-radius:8px;padding:5px 8px;color:var(--ink);cursor:pointer;line-height:1.35}
.node:hover{background:var(--sunk)}
.node.sel{background:var(--soft);border-color:var(--c)}
.node .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c)}
.node .en{color:var(--muted);font-size:12.5px;margin-left:2px}
.node .tick{margin-left:auto;color:var(--flow);font-size:13px;flex:none}
.node .nb{flex:none;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.tw{flex:none;width:18px;height:18px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0;margin-right:-4px;transition:transform .15s}
.tw[aria-expanded="false"]{transform:rotate(-90deg)}
.tw.ph{visibility:hidden}
.row{display:flex;align-items:center}
.lvl0>.row .node{font-family:var(--serif);font-size:17px;font-weight:800}
.lvl1>.row .node{font-weight:600}
li[hidden-kids]>ul{display:none}

.detail{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:22px 26px 24px;max-height:calc(100vh - 40px);overflow:auto}
.detail .crumb{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.detail h2{font-family:var(--serif);font-size:25px;line-height:1.3;margin:0}
.detail h2 small{display:block;font-family:var(--sans);font-size:14px;color:var(--muted);font-weight:500;margin-top:2px}
.detail .lead{font-size:16.5px;margin:14px 0 6px;padding:10px 14px;background:var(--soft);border-radius:10px}
.detail .body{max-width:68ch}
.detail .body p{margin:.7em 0}
.detail h3{font-size:14.5px;margin:20px 0 4px;color:var(--c)}
.detail table,.doc table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
.detail th,.detail td,.doc th,.doc td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.detail th,.doc th{background:var(--sunk);font-weight:600}
.tbl{overflow-x:auto}
.box{border-left:3px solid var(--c);padding:6px 12px;margin:8px 0;background:var(--sunk);border-radius:0 8px 8px 0}
.kids{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kids button,.linkbtn{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 12px;cursor:pointer}
.kids button:hover,.linkbtn:hover{border-color:var(--c,var(--sell))}
.notes{margin-top:22px;border-top:1px dashed var(--line);padding-top:14px}
.notes label.chk{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}
.notes input[type=checkbox]{width:18px;height:18px;accent-color:var(--flow)}
.notes textarea{width:100%;min-height:110px;margin-top:10px;font:inherit;font-size:14.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.status{font-size:12.5px;color:var(--muted);margin-top:4px}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:14px}

/* docs */
.doc{max-width:860px}
.doc h2{font-family:var(--serif);font-size:28px;margin:6px 0 4px;line-height:1.3}
.doc h3{font-family:var(--serif);font-size:20px;margin:34px 0 8px;padding-top:8px}
.doc h4{font-size:15.5px;margin:20px 0 4px}
.doc p,.doc li{max-width:72ch}
.doc .intro{font-size:17px;color:var(--muted);margin-top:4px}
.doc ol.steps{counter-reset:s;list-style:none;padding:0}
.doc ol.steps>li{counter-increment:s;position:relative;padding:10px 0 10px 46px;border-bottom:1px solid var(--line)}
.doc ol.steps>li::before{content:counter(s);position:absolute;left:0;top:10px;width:30px;height:30px;border-radius:50%;background:var(--c);color:var(--surface);font-weight:700;display:grid;place-items:center;font-size:14px}
.doc .callout{background:var(--soft);border-radius:12px;padding:12px 16px;margin:14px 0}
.doc code,.detail code{font-family:"IBM Plex Sans",var(--sans);background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:.92em}
.mods{display:grid;gap:12px}
.mod{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.mod input{width:20px;height:20px;margin-top:4px;accent-color:var(--flow)}
.mod h4{margin:0;font-size:16px}
.mod h4 small{color:var(--muted);font-weight:400;margin-left:8px}
.mod p{margin:2px 0 6px}
.mod .kids{grid-column:2}
.mynotes article{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:10px 16px;margin:10px 0}
.mynotes article h4{margin:0 0 4px}
.mynotes article p{white-space:pre-wrap;margin:0}
.empty{color:var(--muted)}
footer{margin-top:40px;color:var(--muted);font-size:13px}

.c-ind{--c:var(--ink);--soft:var(--sunk)}
.c-buy{--c:var(--buy);--soft:var(--buy-soft)}
.c-sell{--c:var(--sell);--soft:var(--sell-soft)}
.c-flow{--c:var(--flow);--soft:var(--flow-soft)}
.c-plat{--c:var(--plat);--soft:var(--plat-soft)}

@media (max-width:860px){
  .map{grid-template-columns:1fr}
  .detail{position:static;max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>AmplifyME 赛前笔记<span class="split">从零看懂金融市场、投行和资管，再上模拟器</span></h1>
    <div class="progress" aria-live="polite">
      <small id="progText">已掌握 0 个知识点</small>
      <div class="bar"><i id="progBar"></i></div>
      <small id="saveMode">笔记加载中</small>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="map" aria-selected="true">思维导图</button>
    <button role="tab" data-tab="ib" aria-selected="false">投行角色</button>
    <button role="tab" data-tab="am" aria-selected="false">资管角色</button>
    <button role="tab" data-tab="path" aria-selected="false">学习路线</button>
    <button role="tab" data-tab="plan" aria-selected="false">比赛策略</button>
    <button role="tab" data-tab="gloss" aria-selected="false">术语表</button>
    <button role="tab" data-tab="mine" aria-selected="false">我的笔记</button>
  </nav>

  <section class="panel on" id="p-map">
    <div class="legend">
      <span style="--c:var(--buy)">买方 / 资管</span>
      <span style="--c:var(--sell)">卖方 / 投行</span>
      <span style="--c:var(--flow)">交易机制（流动性、报价、风险）</span>
      <span style="--c:var(--plat)">比赛界面</span>
    </div>
    <div class="map">
      <div class="tree" id="tree"></div>
      <article class="detail" id="detail" aria-live="polite"></article>
    </div>
  </section>

  <section class="panel doc c-sell" id="p-ib"></section>
  <section class="panel doc c-buy" id="p-am"></section>
  <section class="panel doc c-flow" id="p-path"></section>
  <section class="panel doc c-ind" id="p-plan"></section>
  <section class="panel doc c-ind" id="p-gloss"></section>
  <section class="panel doc c-ind mynotes" id="p-mine"></section>

  <footer>内容依据你提供的 AmplifyME 准备视频截图整理；带“推测”字样的地方是截图里看不全、按行业常识补充的，比赛时以平台实际规则为准。</footer>
</div>

<script>
/* ---------- 知识点数据 ---------- */
const N = [
{id:'root',p:null,c:'ind',t:'金融市场全景',en:'Financial Markets',
 s:'比赛前要建立的整体认知：谁有钱、谁提供服务、一笔交易怎么从想法变成成交。',
 b:`<p>建议按这个顺序读：先看<b>买方和卖方</b>分别是谁，再看<b>投行</b>和<b>资管</b>内部有哪些岗位，然后看<b>一笔交易</b>怎么流动，接着学<b>流动性、报价、风险</b>这三个交易核心概念，最后看两个角色在模拟器里怎么被打分。</p>
 <p>比赛里你会扮演两种角色之一：<b>投资银行</b>（给客户报价、管理风险）或<b>资产管理</b>（管理 2000 万美元基金、跑赢指数）。两边你都要懂，因为你的对手方就是另一边。</p>`,
 g:'每个知识点右侧都可以写笔记、勾选“已掌握”，进度会显示在页面右上角。'},

{id:'ind',p:'root',c:'ind',t:'行业全景：买方与卖方',en:'Industry overview',src:'截图 1',
 s:'金融机构分两边：买方管钱、买资产；卖方向买方卖服务。',
 b:`<p>图里有两条箭头。黄色箭头从买方指向卖方，写着 <b>Commission &amp; Fees</b>：买方付钱。橙色箭头从卖方指回买方，写着 <b>Services</b>：卖方提供交易执行、研究、融资、流动性等服务。</p>
 <p>记住一句话：<b>买方拿着钱找机会，卖方围着买方提供工具。</b></p>`,
 g:'比赛里资管（AM）和对冲基金（HF）是买方；投行（IB）是卖方。两边通过聊天框询价、报价、成交。'},
{id:'buy',p:'ind',c:'buy',t:'买方',en:'Buy side',
 s:'手里有钱、负责投资的机构，目标是投资回报。',
 b:`<p>买方的钱大多不是自己的，而是客户的：退休金、富人的财富、大学基金等。它们收管理费，靠投资业绩吸引更多资金。</p><p>买方需要卖方帮它们执行交易、提供研究和融资，所以是卖方的<b>客户</b>。</p>`},
{id:'hf',p:'buy',c:'buy',t:'对冲基金',en:'Hedge Funds',
 s:'策略灵活，可以做空、加杠杆，追求不论涨跌都赚钱。',
 b:`<p>常见收费是“2 and 20”：每年收 2% 管理费，加上利润的 20% 作为业绩提成（现在普遍更低）。交易频繁，是投行<b>最重要的佣金来源之一</b>。</p><p>例子：Citadel、Millennium、Bridgewater、Man Group。</p>`,
 g:'在投行视角的截图里，向你询价的客户叫 HF1，就是对冲基金。'},
{id:'amc',p:'buy',c:'buy',t:'资产管理公司',en:'Asset Managers',
 s:'管理共同基金、ETF 和机构账户，大多只做多，目标是跑赢或跟踪一个基准指数。',
 b:`<p>按管理规模（AUM）收一个百分比的管理费。规模巨大，单笔交易很大，所以特别在意<b>执行成本</b>。</p><p>例子：BlackRock、Vanguard、Fidelity、Schroders。</p>`,
 g:'比赛里的 AM 角色就是这个：一只 2000 万美元的全球只做多（Global Long only）基金。'},
{id:'pension',p:'buy',c:'buy',t:'养老基金',en:'Pension Funds',
 s:'管理员工退休金，投资期限很长，首要任务是确保将来付得起养老金。',
 b:`<p><b>DB（确定给付型）</b>承诺退休后发固定金额，所以要让资产匹配未来负债，常用 LDI（负债驱动投资）。<b>DC（确定缴费型）</b>只确定缴多少，最终拿多少看投资表现。</p><p>很多养老金把钱外包给资管公司打理，所以它在资管那张图里也是<b>客户</b>。负债估值和资产负债匹配正是精算的核心工作。</p>`},
{id:'pe',p:'buy',c:'buy',t:'私募股权',en:'Private Equity',
 s:'买下整家非上市公司，改善经营后几年内卖出或上市退出。',
 b:`<p>典型操作是杠杆收购（LBO）：用大量借款买公司。资产流动性很差，几年才退出一次。主要使用投行的并购顾问和杠杆融资服务，而不是二级市场交易。</p><p>例子：Blackstone、KKR、CVC、EQT。</p>`},
{id:'sell',p:'ind',c:'sell',t:'卖方',en:'Sell side',
 s:'向买方提供交易、研究、融资等服务，收佣金和费用。',
 b:`<p>卖方的“产品”是服务：帮你买到想买的股票、告诉你市场在发生什么、帮企业发股发债。收入来自佣金、买卖价差、承销费和顾问费。</p>`},
{id:'ibk',p:'sell',c:'sell',t:'投资银行',en:'Investment Banks',
 s:'卖方里最大的一类，一半做交易（通往市场），一半做融资和并购（通往资金）。',
 b:`<p>内部结构见导图里的“投行内部结构”。例子：Goldman Sachs、JPMorgan、Morgan Stanley、Barclays。</p>`,
 g:'比赛里的 IB 角色只涉及“交易”那一半：给客户报价，然后在交易所对冲。'},
{id:'idb',p:'sell',c:'sell',t:'交易商间经纪商',en:'Interdealer Brokers',
 s:'专门撮合银行和银行之间的交易，提供匿名性和流动性。',
 b:`<p>主要在场外市场（OTC），例如利率互换、国债、外汇。A 银行想对冲风险但不想让竞争对手知道自己的头寸，就通过经纪商匿名成交。经纪商自己不承担风险，只收经纪费。例子：TP ICAP、BGC Group、Tradition，伦敦是重镇。</p>`},
{id:'rh',p:'sell',c:'sell',t:'研究机构',en:'Research Houses',
 s:'只卖研究报告、不做交易或承销的独立研究机构。',
 b:`<p>卖点是“独立、没有利益冲突”。欧盟 2018 年的 MiFID II 要求把研究费和交易佣金拆开收，推动了独立研究的发展（英国后来对这条有所放宽）。</p>`},
{id:'flows',p:'ind',c:'ind',t:'钱和服务怎么流动',en:'Commission & fees / Services',
 s:'买方付佣金和费用，卖方提供服务，这是整个行业的商业模式。',
 b:`<p>例子：一家对冲基金想买 10 万股 BP。它在聊天里请投行报价，投行给出买价和卖价，基金接受后成交，投行收取佣金（或通过价差赚钱）。投行接着自己去交易所把风险对冲掉。</p>`,
 g:'模拟器顶部的 Commission 指标，以及交易所面板里的 COMMISSION 一栏，就是这条箭头的金额。'},

{id:'ibov',p:'root',c:'sell',t:'投行内部结构',en:'Investment Bank Overview',src:'截图 2',
 s:'投行做两件事：帮投资者进入市场（交易），帮企业拿到资金（融资与并购）。',
 b:`<p>左半边 <b>Access to Markets</b> 是市场部（Markets / Sales &amp; Trading），服务买方机构。右半边 <b>Access to Money</b> 是投行部（IBD），服务企业和政府。</p>
 <div class="tbl"><table><tr><th>半边</th><th>岗位</th><th>做什么</th></tr>
 <tr><td rowspan="2">通往市场</td><td>Sales、Prime Brokerage</td><td>与客户沟通</td></tr>
 <tr><td>结构化产品/研究、做市商/量化</td><td>设计和定价金融产品</td></tr>
 <tr><td rowspan="2">通往资金</td><td>DCM、ECM</td><td>帮客户融资</td></tr>
 <tr><td>行业覆盖组、M&amp;A</td><td>帮客户发现并完成交易</td></tr></table></div>`,
 g:'比赛只发生在“通往市场”这一半。'},
{id:'mkts',p:'ibov',c:'sell',t:'通往市场',en:'Access to Markets',
 s:'帮投资者买卖证券：和客户沟通、报价、定价、承担风险。',
 b:`<p>这一半又分两组：<b>面向客户的人</b>（销售、销售交易员、主经纪商）和<b>做产品和定价的人</b>（结构化、研究、做市商、量化）。</p>`},
{id:'sales',p:'mkts',c:'sell',t:'销售 / 销售交易员',en:'Sales / Sales Traders',
 s:'面向客户的人：接客户询价，把价格报回去，维护关系。',
 b:`<p><b>Sales</b> 维护客户关系、推介交易想法。<b>Sales trader</b> 负责执行：接到客户“请给我报个价”，转给做市商要价格，再报回客户，同时给客户讲当前市场情况（market colour）。在“交易流程”那张图里是第 3 到第 5 步。</p>`,
 g:'比赛里你作为 IB 在聊天框里回应 HF，发出报价，这就是 sales trader 的工作。回复要快、礼貌，因为“维护客户关系”本身是考核目标。'},
{id:'pb',p:'mkts',c:'sell',t:'主经纪商',en:'Prime Brokerage',
 s:'给对冲基金的一站式服务：借钱、借券、清算、托管。',
 b:`<p>对冲基金要加杠杆就向 PB 借钱，要做空就向 PB 借股票。投行赚利息差和服务费。一家对冲基金的 PB 关系，往往决定它把多少交易量给这家银行。</p>`},
{id:'struct',p:'mkts',c:'sell',t:'结构化产品 / 研究',en:'Structured Products / Research',
 s:'把衍生品打包成定制产品；研究员写研报给客户提供投资想法。',
 b:`<p>结构化产品例如保本票据：客户本金有保护，同时享受部分股票上涨。研究部的分析师覆盖某个行业，发布评级和目标价，这是交易流程第 1 步“Research”的来源之一。</p>`},
{id:'mm',p:'mkts',c:'sell',t:'做市商 / 量化',en:'Market Makers / Quants',
 s:'随时给出买价和卖价，用银行自己的钱承接客户的交易。',
 b:`<p>做市商同时报出<b>买价（bid）</b>和<b>卖价（offer）</b>，客户可以选一边成交。做市商赚的是两个价格之间的差，但承担成交后价格变动的风险。量化团队建定价模型和自动交易算法。</p>`,
 g:'这是比赛中 IB 角色的核心：给出双边报价，成交后去交易所管理风险。'},
{id:'money',p:'ibov',c:'sell',t:'通往资金',en:'Access to Money',
 s:'投行部：帮企业融资、做并购。这一半不在比赛里出现。',
 b:`<p>收入主要是承销费和顾问费，按项目收取，周期长。</p>`},
{id:'dcm',p:'money',c:'sell',t:'债务资本市场',en:'DCM',
 s:'帮企业和政府发行债券、安排贷款。',b:`<p>例如一家公司要借 10 亿美元，DCM 帮它设计债券条款、找投资者认购。</p>`},
{id:'ecm',p:'money',c:'sell',t:'股权资本市场',en:'ECM',
 s:'帮企业 IPO、增发股票。',b:`<p>IPO 时投行定价、找投资者认购并承销。买方机构常因为想拿到热门 IPO 的配售而维护和投行的关系。</p>`},
{id:'cov',p:'money',c:'sell',t:'行业覆盖组',en:'Industry Coverage',
 s:'按行业分组的银行家，和企业高管保持关系，发掘交易机会。',b:`<p>例如 TMT 组、医疗组、能源组。他们发现客户有融资或并购需求后，再联动 DCM、ECM 或 M&amp;A 执行。</p>`},
{id:'mna',p:'money',c:'sell',t:'并购',en:'M&A',
 s:'为收购或出售公司提供顾问：估值、谈判、交易结构。',b:`<p>Lazard、Evercore 这类精品投行主要做这一块。PE 是重要客户。</p>`},

{id:'amov',p:'root',c:'buy',t:'资管内部结构',en:'Asset Manager Overview',src:'截图 3',
 s:'投资者把钱交给资管；资管内部分工把钱投出去，同时向客户募集新的资金。',
 b:`<p>图里右侧两条线：蓝线把 <b>Investment Services</b>（投资服务）交给客户；红线把客户的 <b>Cash</b>（资金）通过 Sales &amp; Distribution 带进公司。</p>
 <p>左侧说明投资者的钱可以交给四类机构：资产管理、对冲基金、私募股权、风险投资。</p>`},
{id:'inv4',p:'amov',c:'buy',t:'投资者与四类机构',en:'Traders & Investors',
 s:'同样是管钱，资管、对冲、PE、VC 的投资对象和风格不同。',
 b:`<div class="tbl"><table><tr><th>机构</th><th>投什么</th><th>典型特点</th></tr>
 <tr><td>资产管理</td><td>上市股票、债券</td><td>只做多，跟基准比</td></tr>
 <tr><td>对冲基金</td><td>几乎什么都可以</td><td>可做空、加杠杆，追求绝对收益</td></tr>
 <tr><td>私募股权</td><td>成熟的非上市公司</td><td>控股、几年退出</td></tr>
 <tr><td>风险投资</td><td>早期创业公司</td><td>小额多投，赌少数大成功</td></tr></table></div>`},
{id:'fm',p:'amov',c:'buy',t:'基金经理',en:'Fund Manager / PM',
 s:'决定买什么、买多少，并且对业绩负责。',
 b:`<p>在投资约束（mandate）范围内做决策：哪只股票超配、哪只低配，现金留多少。</p>`,
 g:'比赛里你一个人同时是基金经理、研究员和执行交易员。'},
{id:'ra',p:'amov',c:'buy',t:'研究分析师',en:'Research Analyst',
 s:'研究公司和行业，给基金经理提供买卖建议。',
 b:`<p>买方分析师的研究只给自己的基金用，直接影响下单；卖方分析师的研报是公开发给客户的。</p>`,
 g:'比赛里的“研究”就是读新闻面板：判断每条新闻对哪只股票是利好还是利空、影响有多大。'},
{id:'et',p:'amov',c:'buy',t:'执行交易员',en:'Execution Trader',
 s:'负责把基金经理的订单以尽量接近市价的价格完成。',
 b:`<p>要决定在哪里成交（找投行报价还是直接上交易所）、是否拆单、什么时候下单。目标是降低交易成本。</p>`,
 g:'对应比赛的 EXE 评分：大单找投行，小单可以上交易所。'},
{id:'sd',p:'amov',c:'buy',t:'销售与分销',en:'Sales & Distribution',
 s:'向客户募集资金，维护客户关系、汇报业绩。',b:`<p>业绩好，募资容易；资金规模越大，管理费收入越高。</p>`},
{id:'clients',p:'amov',c:'buy',t:'资管的客户',en:'High Net Worths / Pension Funds / Charities',
 s:'高净值个人、养老金、慈善机构，每类客户的风险偏好不同。',
 b:`<p>客户的要求写进<b>投资约束（mandate）</b>：能投什么、偏离基准多少、能亏多少。</p>`,
 g:'比赛的客户风险偏好是“High, tech and crypto assets”，所以基准里全是科技股和加密资产（具体资产每场可能不同）。'},

{id:'flow',p:'root',c:'flow',t:'一笔交易的流程',en:'The Flow of a Trade',src:'截图 4',
 s:'从研究想法到交易所成交的六步。上半部分在资管，下半部分在投行。',
 b:`<p>图例里有两种箭头：<b style="color:var(--danger)">红色 Risk trade</b> 是客户和银行之间的交易，风险从客户转到银行；<b style="color:var(--flow)">绿色 Risk management</b> 是银行在交易所对冲自己接过来的风险。</p>`,
 g:'比赛里 AM 走第 2 到第 5 步，IB 走第 3 到第 6 步。'},
{id:'f1',p:'flow',c:'flow',t:'第 1 步：研究提供想法',en:'Research → PM',
 s:'研究团队（自己的或投行的）把分析结果交给基金经理。',b:`<p>例如：“微软财报大超预期，建议超配。”</p>`},
{id:'f2',p:'flow',c:'flow',t:'第 2 步：基金经理下单',en:'PM → Execution trader',
 s:'基金经理决定买 10 万股 BP，把订单交给执行交易员。',b:`<p>订单包括股票、数量、方向，有时还有价格限制。</p>`},
{id:'f3',p:'flow',c:'flow',t:'第 3 步：向投行询价',en:'Request for quote (RFQ)',
 s:'执行交易员问投行：“请给我 10 万股 BP 报个价”，通常不说自己要买还是卖。',
 b:`<p>为什么不说方向？如果银行知道你要买，就可能把价格往上报。只要一个<b>双边报价</b>（two-way price），银行必须同时给出买价和卖价，你再选一边。</p>`,
 g:'比赛聊天框里的原话：“Could you make me a price for 50,000 BP please?”'},
{id:'f4',p:'flow',c:'flow',t:'第 4 步：销售交易员找做市商要价',en:'Sales trader ↔ Market maker',
 s:'销售交易员把询价转给做市商，做市商根据参考价、自己的头寸和市场流动性定价。',b:`<p>例如参考价 41.5，做市商给出 41 / 42：愿意 41 买入、42 卖出。</p>`},
{id:'f5',p:'flow',c:'flow',t:'第 5 步：报价回给客户，客户成交',en:'Quote → client',
 s:'客户接受一边：买就按卖价（offer）成交，卖就按买价（bid）成交。风险此刻转给银行。',
 b:`<p>交易员行话：客户说 <code>Mine</code> 表示“我买”，说 <code>Yours</code> 表示“我卖给你”。报价有有效期，过期作废。</p>`},
{id:'f6',p:'flow',c:'flow',t:'第 6 步：做市商去交易所对冲',en:'Market maker → Exchange',
 s:'银行卖给客户 10 万股后自己是空头，要在交易所分批买回来，管理风险。',
 b:`<p>这是图里唯一的绿色箭头。如果银行不对冲，价格上涨就会亏钱。</p>`,
 g:'IB 角色的 SSRM 评分就看这一步做得好不好。'},

{id:'liq',p:'root',c:'flow',t:'流动性',en:'Understanding Liquidity',src:'截图 5、6',
 s:'能不能在不明显影响价格的情况下，快速买卖大量证券。',
 b:`<p>流动性好：买卖价差窄、每个价位挂单多，大单也不太推动价格。流动性差：价差宽、挂单少，大单会把价格推得很远。</p>`,
 g:'比赛幻灯片明确说：交易所流动性不足，所以 AM 应该找投行报价。'},
{id:'book',p:'liq',c:'flow',t:'订单簿',en:'Order book: bids & offers',
 s:'交易所里所有挂着的买单（bids）和卖单（offers），按价格排好。',
 b:`<p>截图 5 的订单簿：</p>
 <div class="tbl"><table><tr><th>买单量</th><th>买价 Bid</th><th>卖价 Offer</th><th>卖单量</th></tr>
 <tr><td>（被播放键挡住）</td><td>100</td><td>101</td><td>23</td></tr>
 <tr><td>19</td><td>99</td><td>102</td><td>3</td></tr>
 <tr><td>10</td><td>98</td><td>103</td><td>9</td></tr></table></div>
 <p>最高买价 100 叫<b>最优买价</b>，最低卖价 101 叫<b>最优卖价</b>。</p>`},
{id:'spread',p:'liq',c:'flow',t:'买卖价差',en:'Bid-offer spread',
 s:'最优卖价减最优买价。上例 101 − 100 = 1，中间价 100.5。',
 b:`<p>价差是“立刻成交”的成本。你现在就要买，只能按别人挂的 101 买；现在就要卖，只能按 100 卖。来回一趟就亏掉一个价差。</p>`},
{id:'depth',p:'liq',c:'flow',t:'深度与滑点',en:'Depth & slippage',
 s:'订单越大，越要吃到后面更差的价位，平均成交价越差。',
 b:`<p>上面的订单簿里想买 30 股：</p>
 <div class="box">23 股 × 101 + 3 股 × 102 + 4 股 × 103 = 3,041<br>平均价 = 3,041 ÷ 30 ≈ <b>101.37</b>，比最优卖价差了 0.37</div>
 <p>平均成交价和参考价之间的差距就是<b>滑点</b>。这个过程叫“吃掉订单簿”（walking the book）。</p>`,
 g:'比赛交易所面板的 SELL / BUY 价格，就是你输入的数量对应的平均价。截图里 10 万股 BP 在交易所的价格是 29.68 / 56.08，而参考价约 42.9，大单直接上交易所非常吃亏。'},
{id:'taker',p:'liq',c:'flow',t:'做市方与价格接受方',en:'Market maker vs price taker',
 s:'做市商在买价买、在卖价卖；客户（价格接受方）正好相反。',
 b:`<div class="tbl"><table><tr><th></th><th>Bid 95.5</th><th>Ref 96</th><th>Offer 96.5</th></tr>
 <tr><td>做市商</td><td>买入</td><td></td><td>卖出</td></tr>
 <tr><td>客户</td><td>卖出</td><td></td><td>买入</td></tr></table></div>
 <p>截图 6 的走势里价格突然冲到 100 又回落。如果客户此时在交易所硬买，会买在高点。所以幻灯片说：客户需要银行“做”出一个更好的价格。</p>`},

{id:'price',p:'root',c:'flow',t:'报价',en:'Making a Price',src:'截图 7',
 s:'银行围绕参考价给出买价和卖价，要比交易所对这个数量的价格好，又要能赚钱。',
 b:`<p>截图 7 的数字：</p>
 <div class="tbl"><table><tr><th>价格</th><th>含义</th></tr>
 <tr><td>$170</td><td>交易所卖价（这个数量的平均价）</td></tr>
 <tr><td>$152</td><td>银行卖价</td></tr>
 <tr><td>$150</td><td>参考价</td></tr>
 <tr><td>$148</td><td>银行买价</td></tr>
 <tr><td>$130</td><td>交易所买价</td></tr></table></div>
 <p>银行 148 / 152 远好于交易所 130 / 170，所以客户愿意找银行。银行赚 ±2 的价差作为承担风险的回报。</p>`},
{id:'ref',p:'price',c:'flow',t:'参考价',en:'Reference price',
 s:'当前公允中间价，界面上的 REFPRICE 一栏。所有报价都围绕它来定。',
 b:`<p>参考价会随新闻和交易实时变动，所以报价要用最新的参考价，并且设置较短的有效期。</p>`},
{id:'sym',p:'price',c:'flow',t:'没有头寸时：对称报价',en:'Equal spread',
 s:'幻灯片原意：银行没有风险头寸时，买价和卖价可以对称地分布在参考价两侧。',
 b:`<p>例：参考价 150，报 148 / 152，两边各 2。</p>`},
{id:'skew',p:'price',c:'flow',t:'有头寸时：偏移报价',en:'Skewing',
 s:'推测：已有头寸时，把两个价格一起往有利于减仓的方向移动。',
 b:`<p>如果你已经<b>空头</b> 5 万股（之前卖给了客户），你希望下一个客户卖给你，就把报价整体上移，例如 149 / 153：买价更有吸引力，卖价不那么诱人。</p><p>如果你<b>多头</b>，就整体下移，例如 147 / 151。</p>`,
 g:'模拟器里有“建议报价”按钮会自动偏移，可以先看它怎么算再自己练。'},
{id:'width',p:'price',c:'flow',t:'报价宽窄的取舍',en:'Tight vs wide',
 s:'报得宽更安全、每笔更赚钱，但客户不来；报得窄成交多，但风险更大。',
 b:`<p>IB 的考核里既有成交笔数和佣金（要报得有竞争力），又有胖手指和风险管理（不能乱报）。练习时先用参考价 ±0.5% 左右，观察客户接受率再调整。</p>`},

{id:'risk',p:'root',c:'flow',t:'管理风险',en:'Managing Risk',src:'截图 9',
 s:'客户成交后风险在银行手里，要尽快、分批地在交易所平掉。',
 b:`<p>截图 9 的例子：客户以 96.5 买入 10 万份，做市商因此<b>空头 10 万份</b>。平仓计划：在交易所<b>分 10 次、每次买 1 万份</b>。</p>`},
{id:'short',p:'risk',c:'flow',t:'成交后你就有了头寸',en:'Position after the trade',
 s:'卖给客户 = 自己空头，价格上涨就亏；从客户买入 = 自己多头，价格下跌就亏。',
 b:`<p>例：空头 10 万份，价格每上涨 1，亏 10 万美元。所以接完单不能放着不管。</p>`},
{id:'clip',p:'risk',c:'flow',t:'分批平仓',en:'Unwind in clips',
 s:'把大单拆小，每次只吃订单簿最前面的好价位，减少滑点。',
 b:`<p>一次买 10 万份会把订单簿吃穿，平均价很差；拆成 10 次，每次 1 万份，每次都接近参考价。代价是要花时间，期间价格可能变动。</p>`,
 g:'模拟器的交易所面板有“1/10 头寸”快捷按钮，可以练习分批平仓。'},

{id:'ibobj',p:'root',c:'sell',t:'投行的考核',en:'Investment Bank Objectives',src:'截图 10',
 s:'四个目标：维护客户关系、最大化佣金、报出准确价格、限制风险敞口。',
 b:`<p>对应四个评分指标：NUMT、COMM、FFC、SSRM。多个指标都和“同组其他人相比”，说明是相对排名。</p>`},
{id:'numt',p:'ibobj',c:'sell',t:'NUMT：成交笔数',en:'Number of trades',
 s:'和同组的人相比，你和客户成交了多少笔。',b:`<p>要点：回复快、报价有竞争力。客户会货比三家，报价太宽就不成交。</p>`},
{id:'comm',p:'ibobj',c:'sell',t:'COMM：佣金',en:'Commission',
 s:'你的销售带来的佣金，和同组相比。',b:`<p>成交笔数多、单笔金额大，佣金就高。</p>`},
{id:'ffc',p:'ibobj',c:'sell',t:'FFC：胖手指',en:'Fat fingers',
 s:'压力下会不会报错价。',
 b:`<p>常见错误：少打或多打一位（41 写成 4.1 或 411）、买卖价写反（bid 比 offer 高）、填错股票代码、数量少填一个零。点 Send Quote 前花两秒核对：代码、两个价格是否在参考价两侧、数量。</p>`},
{id:'ssrm',p:'ibobj',c:'sell',t:'SSRM：卖方风险管理',en:'Sell side risk management',
 s:'你在交易所平掉风险平得好不好。',b:`<p>推测的好表现：接单后尽快分批平仓，不让头寸长时间暴露，也不在交易所一次性砸大单。</p>`},

{id:'amobj',p:'root',c:'buy',t:'资管的考核与约束',en:'Asset Manager Objectives',src:'截图 11 至 14',
 s:'四个目标：跑赢基准、最大化回报、接近市价执行、遵守风险参数。',

const byId = Object.fromEntries(N.map(n=>[n.id,n]));
const kids = id => N.filter(n=>n.p===id);
const order = []; (function walk(id){order.push(id); kids(id).forEach(k=>walk(k.id));})('root');
function pathOf(id){const out=[];let n=byId[id];while(n){out.unshift(n);n=byId[n.p];}return out;}

/* ---------- 存储 ---------- */
let store = {notes:{}, done:{}, mods:{}, open:{}};
let docRef = null, mode = 'local', saveTimer = null;
try{ const raw = localStorage.getItem('amp-hub-v1'); if(raw) store = Object.assign(store, JSON.parse(raw)); }catch(e){}
function setMode(text){ document.getElementById('saveMode').textContent = text; }
function save(){
  try{ localStorage.setItem('amp-hub-v1', JSON.stringify(store)); }catch(e){}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    if(docRef){
      try{ await docRef.set({notes:store.notes, done:store.done, mods:store.mods}); flash('已保存到你的账号'); }
      catch(e){ flash('账号保存失败，已存在本浏览器'); }
    } else flash('已保存在本浏览器');
  }, 700);
}
function flash(t){ const s=document.getElementById('noteStatus'); if(s) s.textContent=t; }
(async function connect(){
  setMode('笔记保存在本浏览器');
  try{
    if(!window.claude || !window.claude.use) return;
    const db = await window.claude.use('db'); const user = await window.claude.use('user');
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    const ref = db.doc('data/users/' + uid + '/hub');
    const snap = await ref.get();
    if(snap.exists){
      const d = snap.data() || {};
      store.notes = Object.assign({}, store.notes, d.notes||{});
      store.done = Object.assign({}, store.done, d.done||{});
      store.mods = Object.assign({}, store.mods, d.mods||{});
    }
    docRef = ref; setMode('笔记同步到你的账号');
    renderTree(); renderDetail(current); renderPath(); renderMine(); updateProgress();
  }catch(e){ setMode('笔记保存在本浏览器'); }
})();

/* ---------- 导图 ---------- */
let current = 'root';
const defaultOpen = new Set(['root']);
function isOpen(id){ return store.open[id]!==undefined ? store.open[id] : defaultOpen.has(id); }
function renderTree(){
  const el = document.getElementById('tree');
  function li(n, lvl){
    const ks = kids(n.id);
    const open = isOpen(n.id);
    const hasNote = (store.notes[n.id]||'').trim().length>0;
    let h = `<li class="lvl${lvl} c-${n.c}" ${ks.length&&!open?'hidden-kids':''}><div class="row">`;
    h += ks.length ? `<button class="tw" aria-label="展开或收起 ${n.t}" aria-expanded="${open}" data-tw="${n.id}">▼</button>` : `<span class="tw ph"></span>`;
    h += `<button class="node ${n.id===current?'sel':''}" data-id="${n.id}"><span class="dot"></span><span>${n.t}<span class="en"> ${n.en}</span></span>${hasNote?'<span class="nb">笔记</span>':''}${store.done[n.id]?'<span class="tick" aria-label="已掌握">✓</span>':''}</button></div>`;
    if(ks.length) h += `<ul>${ks.map(k=>li(k,lvl+1)).join('')}</ul>`;
    return h + '</li>';
  }
  el.innerHTML = `<ul>${li(byId.root,0)}</ul>`;
}
function renderDetail(id){
  const n = byId[id]; current = id;
  const d = document.getElementById('detail');
  d.className = 'detail c-' + n.c;
  const crumbs = pathOf(id).slice(0,-1).map(x=>x.t).join(' / ');
  const ks = kids(id);
  const idx = order.indexOf(id);
  const prev = order[idx-1], next = order[idx+1];
  d.innerHTML = `
    ${crumbs?`<p class="crumb">${crumbs}${n.src?'　来源：'+n.src:''}</p>`:''}
    <h2>${n.t}<small>${n.en}</small></h2>
    <p class="lead">${n.s}</p>
    <div class="body">${n.b||''}</div>
    ${n.g?`<h3>在比赛里</h3><div class="box">${n.g}</div>`:''}
    ${ks.length?`<h3>往下展开</h3><div class="kids">${ks.map(k=>`<button data-go="${k.id}">${k.t}</button>`).join('')}</div>`:''}
    <div class="notes">
      <label class="chk"><input type="checkbox" id="doneBox" ${store.done[id]?'checked':''}> 我已经搞懂这个知识点</label>
      <textarea id="noteBox" placeholder="写下你的理解、疑问，或者想问 Claude 的问题">${escapeHtml(store.notes[id]||'')}</textarea>
      <div class="status" id="noteStatus"></div>
    </div>
    <div class="navrow">
      ${prev?`<button class="linkbtn" data-go="${prev}">上一个：${byId[prev].t}</button>`:'<span></span>'}
      ${next?`<button class="linkbtn" data-go="${next}">下一个：${byId[next].t}</button>`:''}
    </div>`;
  document.getElementById('noteBox').addEventListener('input', e=>{ store.notes[id]=e.target.value; flash('保存中'); save(); });
  document.getElementById('doneBox').addEventListener('change', e=>{ store.done[id]=e.target.checked; save(); renderTree(); updateProgress(); });
}
function escapeHtml(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function select(id, scroll){
  pathOf(id).slice(0,-1).forEach(a=>store.open[a.id]=true);
  current = id; renderTree(); renderDetail(id);
  if(scroll && window.matchMedia('(max-width:860px)').matches) document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'});
}
function updateProgress(){
  const total = N.length, done = N.filter(n=>store.done[n.id]).length;
  document.getElementById('progText').textContent = `已掌握 ${done} / ${total} 个知识点`;
  document.getElementById('progBar').style.width = (done/total*100)+'%';
}
document.addEventListener('click', e=>{
  const tw = e.target.closest('[data-tw]');
  if(tw){ const id=tw.dataset.tw; store.open[id]=!isOpen(id); renderTree(); save(); return; }
  const nd = e.target.closest('[data-id]');
  if(nd){ select(nd.dataset.id, true); return; }
  const go = e.target.closest('[data-go]');
  if(go){ showTab('map'); select(go.dataset.go, true); if(!window.matchMedia('(max-width:860px)').matches) window.scrollTo({top:0,behavior:'smooth'}); return; }
  const tb = e.target.closest('[data-tab]');
  if(tb){ showTab(tb.dataset.tab); }
});
function showTab(t){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===t));
  document.querySelectorAll('section.panel').forEach(p=>p.classList.toggle('on', p.id==='p-'+t));
  if(t==='mine') renderMine();
  if(history.replaceState) try{ history.replaceState(null,'','#'+t); }catch(e){}
}

document.getElementById('p-ib').innerHTML = `
<h2>投行角色：给客户报价，然后管理风险</h2>
<p class="intro">比赛里的 IB 是投行“通往市场”那一半的<b>销售交易员 + 做市商</b>。你不需要估值公司，你要做的是：客户问价，你报价；客户成交，你接住风险；然后去交易所把风险平掉。</p>

<h3>你是怎么赚钱的</h3>
<p>两个来源。第一是<b>佣金</b>：客户每和你成交一笔，你就拿到一笔佣金（顶部的 Commission）。第二是<b>交易盈亏</b>：你以 42 卖给客户，之后在交易所平均 41.6 买回来，每股赚 0.4（Realised P&amp;L）。如果买回时价格涨到 43，就亏钱。</p>
<div class="callout">一句话：<b>报价要让客户愿意成交，又要给自己留出平仓的空间。</b></div>

<h3>一笔完整的交易，按顺序</h3>
<ol class="steps">
<li><b>客户来询价。</b>聊天框出现：“Could you make me a price for 50,000 BP please?” 客户只说数量，不说买还是卖。</li>
<li><b>看三个数字。</b>BP 的参考价（比如 55.0）；交易所对 5 万股的价格（比如 52.1 / 61.8，很差）；你自己现在的 BP 头寸。</li>
<li><b>定价格。</b>没有头寸时对称报价，比如参考价 ±1%：54.45 / 55.55。已有空头就整体上移，已有多头就整体下移。你的价格要明显好于交易所，否则客户自己去交易所做。</li>
<li><b>填表单并核对。</b>Ticker 填 BP；Valid for seconds 填 30 到 45；Bid 54.45、Offer 55.55；Bid Volume 和 Offer Volume 都填 50000。点 Send Quote 之前核对：代码对不对、bid 是否低于 offer、两个价格是否夹住参考价、数量有没有少一个零。</li>
<li><b>客户成交。</b>客户买（Mine），你就以 55.55 卖出 5 万股，变成空头 5 万股。客户卖（Yours），你以 54.45 买入，变成多头。</li>
<li><b>马上平仓。</b>空头 5 万股，就在交易所分 5 到 10 次买回，每次 5000 到 1 万股，每次价格都接近参考价。全部平完后，你锁定了价差利润。</li>
</ol>

<h3>四个评分指标怎么拿分</h3>
<div class="tbl"><table>
<tr><th>指标</th><th>考什么</th><th>怎么做</th></tr>
<tr><td>NUMT 成交笔数</td><td>和同组相比成交了多少笔</td><td>回复快；报价有竞争力；客户没成交时可以问一句“Too wide? Happy to improve.”</td></tr>
<tr><td>COMM 佣金</td><td>和同组相比的佣金</td><td>多成交、接大单</td></tr>
<tr><td>FFC 胖手指</td><td>有没有报错价</td><td>每次发报价前核对四项：代码、方向、价格位置、数量</td></tr>
<tr><td>SSRM 风险管理</td><td>在交易所平仓平得好不好</td><td>接单后尽快分批平；不要攒着大头寸赌方向</td></tr>
</table></div>

<h3>新手最容易犯的错</h3>
<p><b>报价写反。</b>Bid 是你愿意买的价格，一定比 Offer 低。记法：你作为银行要“低买高卖”。</p>
<p><b>只看客户、不看头寸。</b>连续卖给三个客户后你已经空头 15 万股，此时再按对称价报，风险会越滚越大。</p>
<p><b>在交易所一次砸单。</b>把 5 万股一次买回，平均价可能比参考价高好几个百分点，前面赚的价差全部吐回去。</p>
<p><b>抱着头寸看新闻。</b>手里有空头时出现利好新闻，价格会跳涨。先平仓再说。</p>

<h3>常用英文聊天句子</h3>
<div class="tbl"><table>

`;

<tr><td>EXE 执行</td><td>大单能否接近参考价成交</td><td>大单找投行，比较报价；小单（几十万美元）可用交易所</td></tr>
<tr><td>BSRM 风险管理</td><td>有没有突破止损</td><td>浮亏到 30 至 40 万美元就开始减仓</td></tr>
<tr><td>RA 风险偏好</td><td>是否全程至少 90% 投入</td><td>先建仓再思考；卖出后立刻买回别的</td></tr>
</table></div>

<h3>算一笔账：为什么要找投行</h3>
<p>假设买 10 万股 BP，参考价 42.9。截图里交易所给出的买入价约 56.08，比参考价贵 30%，还要付约 0.5% 佣金。投行报价 41 / 42，你按 42 买入，反而低于参考价。这一单的成本差距是一百多万美元，足以决定整场排名。</p>

<h3>新手最容易犯的错</h3>
<p><b>开局犹豫。</b>想太久才建仓，RA 和权重区间都在扣分。</p>
<p><b>只看涨跌不看权重。</b>某只股票大涨后权重可能超过 30%，要减持。</p>
<p><b>卖出后忘了买回。</b>现金比例一下超过 10%。</p>
<p><b>用交易所做大单。</b>EXE 大幅扣分。</p>
<p><button class="linkbtn" data-go="amobj">在导图里看资管考核</button> <button class="linkbtn" data-go="bench">在导图里看权重区间</button> <button class="linkbtn" data-go="depth">在导图里看滑点</button></p>
`;

/* ---------- 学习路线 ---------- */

 {id:'m3',t:'一笔交易的六步',min:10,d:'对着图把 6 步讲一遍，搞清楚“询价时为什么不说方向”。',go:['flow','f3','f5','f6']},

 {id:'m8',t:'复盘，写下比赛日计划',min:10,d:'把两局的结果和困惑写进“我的笔记”，带着问题回来问 Claude。',go:[]}

/* ---------- 比赛策略 ---------- */
document.getElementById('p-plan').innerHTML = `
<h2>比赛策略：目标是完赛并看懂</h2>
<p class="intro">你的目标不是排名，是完整走完两个小时并理解每一步。所以策略的核心是：<b>先守规矩，再求收益</b>。规则类指标（RA、区间、止损、胖手指）只要细心就能拿满，收益类指标看运气和判断。</p>

<h3>比赛前</h3>
<p>把导图里“交易界面”那一组过一遍，熟悉每个面板的位置。在模拟器里两个角色各打一局。准备好纸和笔，或在旁边开一个记事本，记录每个持仓的权重。确认场次时间：官网时间多是美东时间，可以用官网给的时区转换链接核对。</p>
<p>官网 FAQ 里一处写“前 300 名进决赛”，另一处写“前 10 名进决赛”，以官方邮件为准。</p>

<h3>比赛中：资管</h3>
<p>开局两分钟内建仓到 90% 以上，每个资产至少 10%。大单全部找投行；同时收到多家报价时选对你最有利的一家（买看谁的 offer 最低，卖看谁的 bid 最高）。每条新闻出来先问三个问题：影响哪只？利好还是利空？我现在这只的权重是多少？</p>

<h3>比赛中：投行</h3>
<p>报价默认用参考价 ±0.5% 到 ±1%，根据客户接受率调整。每笔成交后立刻在交易所分批平仓。手里有头寸时，下一次报价往减仓方向偏移。发报价前用同一套顺序核对：代码、bid 低于 offer、两价夹住参考价、数量。</p>

<h3>比赛后</h3>
<p>把你没搞懂的瞬间记下来，比如“客户为什么没接我的价”“为什么止损了”。回来问我，我们一起复盘。</p>
`;
